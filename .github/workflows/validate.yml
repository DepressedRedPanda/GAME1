# Free check on every push and pull request. No API keys needed.
# Passing means the repo's text is consistent; it is NOT proof of an Unreal compile or PIE.
name: Validate repo
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Balance, scaffolds vs architecture, script syntax, doc links, secrets
        run: python Scripts/validate_repo.py
      - name: Scaffold regression tests (fake Unreal module)
        run: python -m unittest discover -s Scripts/tests -v
